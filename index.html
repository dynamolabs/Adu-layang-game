<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9CC3C9">
<title>Adu Layang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@500;700;800&family=Shrikhand&display=swap">
<style>
  :root { --bg: #9CC3C9; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }
  canvas { display: block; }
  /* layar lebar (PC): kanvas di tengah dengan garis tinta di kiri-kanan */
  @media (min-aspect-ratio: 3/4) { canvas { box-shadow: -2px 0 0 #1F4E5A, 2px 0 0 #1F4E5A; } }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<script>
'use strict';
// Adu Layang v1.2 - Studio Aigame. Arah seni "Sore di kampung": kertas potong, 6 warna, garis tinta seragam. Lihat DESIGN.md.
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

// palet (hanya ini)
const INK = 0x1f4e5a, PAPER = 0xf3e3c3, SKY = 0x9cc3c9, SKY2 = 0xc9dcd2, ORANGE = 0xe8803a, BRICK = 0xb5442c;
const CSS = { ink: '#1F4E5A', paper: '#F3E3C3', sky: '#9CC3C9', sky2: '#C9DCD2', orange: '#E8803A', brick: '#B5442C' };
const LOGO = 'Shrikhand, "Arial Black", Georgia, serif';
const BODY = 'Karla, "Trebuchet MS", Arial, sans-serif';
const LINE = 2;
// Tajam di layar HP: kanvas digambar sebanyak piksel asli layar (devicePixelRatio), kamera memperbesar dunia 450 px.
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
const _addText = Phaser.GameObjects.GameObjectFactory.prototype.text;
Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, t, style) { return _addText.call(this, x, y, t, { resolution: DPR, ...style }); };
const hdCamera = scene => { scene.cameras.main.setZoom(DPR).centerOn(W / 2, H / 2); };

const W = 450;
// Tinggi layar logika ikut bentuk layar HP supaya tidak ada pita hitam.
const H = (() => { const el = document.getElementById('game'); const w = el.clientWidth || innerWidth, h = el.clientHeight || innerHeight;
  return Math.round(clamp(W * h / Math.max(1, w), 800, 980)); })();
const GY = H - 800;
const ANCHOR = { x: 231, y: 676 + GY };
const OPP_ANCHORS = [{ x: 38, y: 694 + GY }, { x: 412, y: 694 + GY }];
const POLES = [-40, 130, 320, 490];
const TOP_Y = 92;
const LOW_Y = 540 + GY;
const FLAG = { x: 268, y: 628 + GY }; // ujung bambu umbul-umbul di atap pemain

const T = { // angka keseimbangan, lihat DESIGN.md
  tug: 900, tugDecay: 2.6, hold: 60, reelIn: 150, reelAfter: 0.9, sink: 180, maxUp: 280, maxDown: 115, steer: 3.2, steerMax: 260, windHold: 0.35, windSlack: 1.6,
  cutRate: 1.3, tugCost: 0.4, stamRegen: 0.55, sawSpeed: 200, regen: 0.12, oppRegen: 0.1, comboWin: 8,
};
const TYPES = {
  pelan:  { speed: 70,  pull: 0.25, pullCross: 0.3,  str: 0.9,  hp: 1,    top: ORANGE, bot: PAPER },
  cepat:  { speed: 125, pull: 0.4,  pullCross: 0.5,  str: 1.0,  hp: 1.25, top: SKY2,   bot: INK },
  jagoan: { speed: 105, pull: 0.45, pullCross: 0.85, str: 1.15, hp: 1.6,  top: INK,    bot: ORANGE },
};
// sudut layangan sedikit tak rata, seperti digunting tangan (tetap, tidak bergetar)
const KITE = [[0.6, -27], [18.5, -6.5], [-0.4, 20], [-17.6, -5.6]];

function wireY(x, i) {
  const base = (i === 0 ? 606 : 621) + GY;
  for (let k = 0; k < POLES.length - 1; k++) {
    if (x >= POLES[k] && x <= POLES[k + 1]) return base + 15 * Math.sin(Math.PI * (x - POLES[k]) / (POLES[k + 1] - POLES[k]));
  }
  return base;
}
function segX(a, b, c, d) {
  const r1x = b.x - a.x, r1y = b.y - a.y, r2x = d.x - c.x, r2y = d.y - c.y;
  const den = r1x * r2y - r1y * r2x;
  if (Math.abs(den) < 1e-6) return null;
  const t = ((c.x - a.x) * r2y - (c.y - a.y) * r2x) / den;
  const u = ((c.x - a.x) * r1y - (c.y - a.y) * r1x) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { x: a.x + t * r1x, y: a.y + t * r1y };
}
function polyX(p, q) {
  for (let i = 2; i < p.length - 1; i++) for (let j = 2; j < q.length - 1; j++) {
    const r = segX(p[i], p[i + 1], q[j], q[j + 1]); if (r) return r;
  }
  return null;
}
function stringPts(a, k, slack, wind, n = 12) {
  const dx = k.x - a.x, dy = k.y - a.y, d = Math.hypot(dx, dy);
  const s = d * (0.05 + 0.13 * slack);
  const cx = (a.x + k.x) / 2 + wind * 0.016 * s, cy = (a.y + k.y) / 2 + s;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push({ x: u * u * a.x + 2 * u * t * cx + t * t * k.x, y: u * u * a.y + 2 * u * t * cy + t * t * k.y });
  }
  return pts;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('aduLayang.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('aduLayang.' + k, JSON.stringify(v)); } catch (e) {} },
};
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
const lerpColor = (a, b, t) => { const ar = a >> 16, ag = (a >> 8) & 255, ab = a & 255, br = b >> 16, bg = (b >> 8) & 255, bb = b & 255;
  return (Math.round(ar + (br - ar) * t) << 16) | (Math.round(ag + (bg - ag) * t) << 8) | Math.round(ab + (bb - ab) * t); };

// ---------- Suara: jarang dan bermakna ----------
const SFX = {
  ctx: null, master: null, muted: store.get('mute', false), noise: null, wind: null, rasp: null,
  pent: [293.66, 334.8, 384.7, 440.5, 508, 587.3, 669.6, 769.4], // slendro kira-kira
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(c.destination);
    const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.wind = this.loopNoise('lowpass', 380, 0.6);
    this.rasp = this.loopNoise('bandpass', 3200, 6);
  },
  loopNoise(type, f, q) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(fl); fl.connect(g); g.connect(this.master); src.start();
    return { g, fl };
  },
  level(node, v) { if (node && this.ctx) node.g.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1); },
  setMute(m) { this.muted = m; store.set('mute', m); if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  burst(f, dur, vol, type = 'highpass', delay = 0) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = 2;
    const g = c.createGain(), t = c.currentTime + delay; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t, rnd(0, 1)); s.stop(t + dur + 0.03);
  },
  bonang(f, delay = 0, vol = 0.12, decay = 0.9) { // logam: nada dasar + parsial tak harmonis
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay;
    [[f, vol, decay], [f * 2.76, vol * 0.3, decay * 0.25], [f * 5.4, vol * 0.08, decay * 0.1]].forEach(([fr, v, dc]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = fr;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dc);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dc + 0.05);
    });
  },
  gong() { this.bonang(73.4, 0, 0.2, 3); },
  reel() { for (let i = 0; i < 3; i++) this.burst(2400, 0.025, 0.12, 'bandpass', i * 0.045); }, // "srek" gulungan
  cut(combo) { this.burst(1800, 0.08, 0.35); const s = Math.min(combo, 3) - 1; [0, 2, 4].forEach((n, i) => this.bonang(this.pent[n + s], 0.05 + i * 0.12)); },
  windShift(dir) { this.bonang(this.pent[dir > 0 ? 3 : 1], 0, 0.05, 1.2); this.bonang(this.pent[dir > 0 ? 5 : 0], 0.3, 0.04, 1.4); },
  bird() { const c = this.ctx; if (!c) return; [0, 0.09].forEach(d => { const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + d;
    o.type = 'sine'; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(3500, t + 0.06);
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.08); }); },
  lose() { this.burst(1500, 0.1, 0.4); [4, 2, 0].forEach((n, i) => this.bonang(this.pent[n] / 2, 0.25 + i * 0.28, 0.13, 1.4)); },
  tap() { this.bonang(this.pent[4], 0, 0.05, 0.3); },
};
document.addEventListener('visibilitychange', () => { if (SFX.ctx) { if (document.hidden) SFX.ctx.suspend(); else SFX.ctx.resume(); } });

// ---------- Gambar ----------
function kitePts(x, y, ang, s) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  return KITE.map(([px, py]) => ({ x: x + (px * ca - py * sa) * s, y: y + (px * sa + py * ca) * s }));
}
function drawKite(g, x, y, ang, s, top, bot, alpha = 1) {
  const [t, r, b, l] = kitePts(x, y, ang, s);
  g.fillStyle(top, alpha); g.fillTriangle(t.x, t.y, r.x, r.y, l.x, l.y);
  g.fillStyle(bot, alpha); g.fillTriangle(l.x, l.y, r.x, r.y, b.x, b.y);
  g.lineStyle(LINE, INK, alpha); g.strokePoints([t, r, b, l], true);
  // rangka bambu: tulang tegak + busur
  const ca = Math.cos(ang), sa = Math.sin(ang), P = (px, py) => ({ x: x + (px * ca - py * sa) * s, y: y + (px * sa + py * ca) * s });
  g.lineStyle(1, INK, 0.7 * alpha); g.lineBetween(t.x, t.y, b.x, b.y);
  const bow = []; for (let i = 0; i <= 6; i++) { const u = i / 6; bow.push(P(-18 + 36 * u, -6 - 8 * Math.sin(Math.PI * u))); }
  g.strokePoints(bow, false);
}
function drawBird(g, b) {
  const w = Math.sin(b.flap) * 8;
  g.lineStyle(2.5, INK, 1);
  g.beginPath(); g.moveTo(b.x - 13, b.y - w); g.lineTo(b.x - 4, b.y - 2); g.lineTo(b.x, b.y + 1); g.lineTo(b.x + 4, b.y - 2); g.lineTo(b.x + 13, b.y - w); g.strokePath();
}
function drawFlag(g, t, wind) {
  // umbul-umbul: bambu tegak dan kain panjang yang berkibar ke arah angin
  g.lineStyle(LINE, INK, 1); g.lineBetween(FLAG.x, FLAG.y, FLAG.x - 2, FLAG.y + 66);
  const dir = wind >= 0 ? 1 : -1, len = 14 + Math.abs(wind) * 0.42, sp = 4 + Math.abs(wind) * 0.08;
  const top = [], bot = [];
  for (let i = 0; i <= 8; i++) { const u = i / 8, x = FLAG.x + dir * len * u, wv = Math.sin(t * sp - u * 5) * 3.5 * u;
    top.push({ x, y: FLAG.y + 2 + wv + u * 3 }); bot.push({ x, y: FLAG.y + 14 - u * 7 + wv + u * 3 }); }
  const poly = top.concat(bot.reverse());
  g.fillStyle(BRICK, 1); g.fillPoints(poly, true); g.lineStyle(1.5, INK, 1); g.strokePoints(poly, true);
}

// latar kertas potong, digambar sekali
function makeTextures(scene) {
  if (scene.textures.exists('bg')) return;
  const tex = scene.textures.createCanvas('bg', Math.round(W * DPR), Math.round(H * DPR)), c = tex.getContext();
  c.scale(DPR, DPR);
  let seed = 7; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const jag = (pts, a = 1.2) => pts.map(([x, y]) => [x + (r() - 0.5) * a * 2, y + (r() - 0.5) * a * 2]);
  const shape = (pts, fill, stroke = true) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath();
    c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = CSS.ink; c.lineWidth = LINE; c.lineJoin = 'round'; c.stroke(); } };
  // langit berpita datar
  c.fillStyle = CSS.sky; c.fillRect(0, 0, W, H);
  shape(jag([[-5, 300 + GY * 0.4], [140, 292 + GY * 0.4], [300, 304 + GY * 0.4], [455, 296 + GY * 0.4], [455, H], [-5, H]], 2), CSS.sky2, false);
  shape(jag([[-5, 470 + GY * 0.8], [180, 462 + GY * 0.8], [455, 474 + GY * 0.8], [455, H], [-5, H]], 2), CSS.paper, false);
  // matahari sore
  const sy = 560 + GY, sun = []; for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2; sun.push([310 + Math.cos(a) * 44, sy + Math.sin(a) * 44]); }
  shape(jag(sun, 1), CSS.orange, false);
  // awan potongan kertas
  const cloud = (x, y, s) => { const p = [[0, 0], [10, -9], [26, -11], [36, -20], [54, -19], [64, -9], [82, -8], [92, 0]].map(([a, b]) => [x + a * s, y + b * s]);
    shape(jag(p, 1.2), CSS.paper); };
  cloud(24, 268 + GY * 0.2, 1.1); cloud(250, 140, 1); cloud(300, 330 + GY * 0.3, 1.2); cloud(70, 410 + GY * 0.5, 0.9);
  // bukit jauh
  shape(jag([[-5, 600 + GY], [60, 566 + GY], [120, 590 + GY], [200, 552 + GY], [290, 594 + GY], [370, 562 + GY], [455, 588 + GY], [455, 660 + GY], [-5, 660 + GY]], 1.5), CSS.sky2);
  // kampung jauh: atap-atap kecil dan kubah masjid
  const far = [];
  far.push([-5, 650 + GY]);
  for (let x = -5; x < 460; x += 28) { const h = 618 + GY + r() * 14; far.push([x, h + 8], [x + 14, h - 6], [x + 28, h + 8]); }
  far.push([455, 670 + GY], [-5, 670 + GY]);
  shape(jag(far, 0.8), CSS.sky);
  const dome = []; for (let i = 0; i <= 12; i++) { const a = Math.PI + i / 12 * Math.PI; dome.push([96 + Math.cos(a) * 15, 612 + GY + Math.sin(a) * 15]); }
  dome.push([111, 630 + GY], [81, 630 + GY]); shape(jag(dome, 0.6), CSS.sky);
  shape(jag([[118, 632 + GY], [118, 588 + GY], [121, 580 + GY], [124, 588 + GY], [124, 632 + GY]], 0.4), CSS.sky);
  // tiang dan kabel listrik
  POLES.forEach(p => { shape([[p - 3, 596 + GY], [p + 3, 596 + GY], [p + 3, 760 + GY], [p - 3, 760 + GY]], CSS.ink, false);
    shape([[p - 15, 602 + GY], [p + 15, 602 + GY], [p + 15, 605 + GY], [p - 15, 605 + GY]], CSS.ink, false); });
  [0, 1].forEach(i => { c.strokeStyle = CSS.ink; c.lineWidth = LINE; c.beginPath(); for (let px = -5; px <= W + 5; px += 3) { const y = wireY(px, i); px <= -5 ? c.moveTo(px, y) : c.lineTo(px, y); } c.stroke(); });
  // rumah depan: dinding kertas, genteng bata
  const house = (x0, w, top) => {
    top += GY;
    shape(jag([[x0 + 6, top + 30], [x0 + w - 6, top + 30], [x0 + w - 6, H + 5], [x0 + 6, H + 5]], 1), CSS.paper);
    shape(jag([[x0, top + 34], [x0 + w * 0.22, top], [x0 + w * 0.78, top], [x0 + w, top + 34]], 1), CSS.brick);
    c.strokeStyle = CSS.ink; c.lineWidth = 1; for (let yy = top + 11; yy < top + 34; yy += 11) { const ins = (top + 34 - yy) / 34 * w * 0.22; c.beginPath(); c.moveTo(x0 + ins, yy); c.lineTo(x0 + w - ins, yy); c.stroke(); }
    const win = (wx, wy) => { shape(jag([[wx, wy], [wx + 14, wy], [wx + 14, wy + 18], [wx, wy + 18]], 0.6), CSS.ink, false); c.fillStyle = CSS.orange; c.fillRect(wx + 3, wy + 3, 8, 12); };
    win(x0 + w * 0.28, top + 52); win(x0 + w * 0.62, top + 52);
  };
  house(-30, 130, 700); house(90, 120, 712); house(285, 110, 714); house(360, 120, 702); house(170, 130, 690);
  // anak-anak di atap (siluet tinta)
  const kid = (x, y, flip) => {
    y += GY; c.fillStyle = CSS.ink;
    c.beginPath(); c.arc(x, y - 30, 6, 0, Math.PI * 2); c.fill();
    c.fillRect(x - 5, y - 24, 10, 16); c.fillRect(x - 5, y - 8, 4, 12); c.fillRect(x + 1, y - 8, 4, 12);
    c.save(); c.translate(x, y - 21); c.rotate(flip ? 0.9 : -0.9); c.fillRect(-2, -12, 4, 13); c.restore();
    c.fillStyle = CSS.paper; c.beginPath(); c.arc(x + (flip ? -9 : 9), y - 10, 4, 0, Math.PI * 2); c.fill(); c.strokeStyle = CSS.ink; c.lineWidth = 1.5; c.stroke();
  };
  kid(222, 704, false); kid(30, 718, false); kid(420, 718, true);
  tex.refresh();
}

// ---------- Kontrol layar ----------
function tagButton(scene, x, y, w, h, label, cb, size = 30) {
  // tombol seperti label kertas yang digunting
  const g = scene.add.graphics();
  const pts = d => [[-w / 2 + 2, -h / 2 + d], [w / 2 - 1, -h / 2 + 2 + d], [w / 2 + 1, h / 2 - 1 + d], [-w / 2, h / 2 + d]].map(([a, b]) => ({ x: x + a, y: y + b }));
  const draw = down => { g.clear(); if (!down) { g.fillStyle(INK, 1); g.fillPoints(pts(4), true); }
    g.fillStyle(BRICK, 1); g.fillPoints(pts(down ? 3 : 0), true); g.lineStyle(LINE, INK, 1); g.strokePoints(pts(down ? 3 : 0), true); };
  draw(false);
  const t = scene.add.text(x, y, label, { fontFamily: BODY, fontSize: size + 'px', color: CSS.paper, fontStyle: '800' }).setOrigin(0.5);
  const z = scene.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
  z.isButton = true;
  z.on('pointerdown', () => { draw(true); t.y = y + 3; });
  z.on('pointerout', () => { draw(false); t.y = y; });
  z.on('pointerup', () => { draw(false); t.y = y; SFX.init(); SFX.tap(); cb(); });
  return { g, t, z, all: [g, t, z] };
}
function iconButton(scene, x, y, kind, cb) {
  const g = scene.add.graphics();
  const draw = () => { g.clear(); g.fillStyle(PAPER, 0.9); g.fillCircle(x, y, 19); g.lineStyle(LINE, INK, 1); g.strokeCircle(x, y, 19); g.fillStyle(INK, 1);
    if (kind === 'pause') { g.fillRect(x - 6, y - 7, 4, 14); g.fillRect(x + 2, y - 7, 4, 14); }
    else { g.fillRect(x - 8, y - 4, 5, 8); g.fillTriangle(x - 4, y - 4, x + 3, y - 9, x + 3, y + 9); g.fillRect(x - 4, y - 4, 7, 8);
      g.lineStyle(LINE, INK, 1);
      if (SFX.muted) { g.lineBetween(x + 6, y - 5, x + 12, y + 5); g.lineBetween(x + 12, y - 5, x + 6, y + 5); }
      else { g.beginPath(); g.arc(x + 4, y, 6, -0.8, 0.8); g.strokePath(); g.beginPath(); g.arc(x + 4, y, 10, -0.8, 0.8); g.strokePath(); } } };
  draw();
  const z = scene.add.zone(x, y, 56, 56).setInteractive({ useHandCursor: true });
  z.isButton = true;
  z.on('pointerup', () => { SFX.init(); cb(); draw(); });
  return { g, z, draw };
}

// ---------- Menu ----------
class Menu extends Phaser.Scene {
  constructor() { super('menu'); }
  create() {

    this.combo = this.time0 - this.lastCut < T.comboWin ? Math.min(3, this.combo + 1) : 1;
    this.lastCut = this.time0; this.cuts++;
    const pts = 100 * this.combo; this.score += pts;
    SFX.cut(this.combo); buzz(this.combo > 1 ? [40, 50, 40] : 45);
    this.fleck(P.x, P.y, 5, o.cfg.top, 90);
    const t = this.add.text(clamp(P.x, 60, W - 60), P.y - 16, '+' + pts, { fontFamily: BODY, fontSize: '20px', color: CSS.ink, fontStyle: '800' }).setOrigin(0.5).setDepth(15);
    this.tweens.add({ targets: t, y: P.y - 50, alpha: 0, duration: 1100, ease: 'Sine.out', onComplete: () => t.destroy() });
  }
  // ----- burung -----
  stepBirds(dt) {
    if (!this.over) {
      this.birdTimer -= dt;
      if (this.birdTimer <= 0) {
        const t = this.time0;
        this.birdTimer = Math.max(3, 7 - t / 25);
        const n = t > 60 ? pick([1, 1, 2, 3]) : 1;
        const dir = Math.random() < 0.5 ? 1 : -1, y = rnd(TOP_Y + 20, LOW_Y), sp = rnd(90, 150) + Math.min(60, t / 3);
        for (let i = 0; i < n; i++) this.birds.push({ x: dir > 0 ? -30 - i * 34 : W + 30 + i * 34, y: y + (i ? (i % 2 ? 22 : -22) : 0), vx: sp * dir, warn: 1.2, flap: rnd(0, 6), chirped: false });
      }
    }
    for (const b of this.birds) {
      if (b.warn > 0) { b.warn -= dt; continue; }
      b.x += b.vx * dt; b.flap += dt * 12; b.y += Math.sin(b.flap * 0.3) * 10 * dt;
      if (!b.chirped && b.x > 0 && b.x < W) { b.chirped = true; SFX.bird(); }
      if (!this.over && Math.hypot(b.x - this.k.x, b.y - this.k.y) < 22) this.lose('burung', 'ditabrak burung.');
    }
    this.birds = this.birds.filter(b => b.warn > 0 || (b.vx > 0 ? b.x < W + 60 : b.x > -60));
  }
  // ----- gambar -----
  render() {
    const g = this.g, k = this.k, now = this.time.now / 1000; g.clear();
    drawFlag(g, now, this.wind);
    for (const o of this.opps) {
      const a = o.alpha ?? 1;
      if (o.state === 'fly') { g.lineStyle(o.pulling ? 1.4 : 1, INK, o.cross ? 0.9 : 0.55); g.strokePoints(stringPts(o.a, o, o.pulling ? 0.15 : 0.7, this.wind), false); }
      else { g.lineStyle(1, INK, 0.5 * a); g.lineBetween(o.x, o.y + 18, o.x - this.wind * 0.3, o.y + 60); }
      drawKite(g, o.x, o.y, o.ang, 1, o.cfg.top, o.cfg.bot, a);
    }
    if (k.alive) {
      // gelasan merah bata, memudar saat aus
      const col = lerpColor(SKY2, BRICK, 0.25 + 0.75 * k.hp);
      g.lineStyle(k.hold ? 2 : 1.6, col, 1); g.strokePoints(stringPts(ANCHOR, k, k.hold ? 0.15 : 0.7, this.wind), false);
    } else { g.lineStyle(1.4, BRICK, 0.7); g.lineBetween(k.x, k.y + 20, k.x - this.wind * 0.3, k.y + 70); }
    drawKite(g, k.x, k.y, k.ang, 1.15, BRICK, PAPER);
    for (const b of this.birds) {
      if (b.warn > 0) {
        if (this.over) continue;
        const x = b.vx > 0 ? 12 : W - 12, f = b.vx > 0 ? 1 : -1, a = 0.45 + 0.45 * Math.abs(Math.sin(b.warn * 6));
        g.lineStyle(2.5, INK, a); g.beginPath(); g.moveTo(x - 4 * f, b.y - 8); g.lineTo(x + 4 * f, b.y); g.lineTo(x - 4 * f, b.y + 8); g.strokePath();
        continue;
      }
      drawBird(g, b);
    }
    for (const f of this.flecks) { g.fillStyle(f.c, Math.min(1, f.life * 3)); g.fillRect(f.x - 1.5, f.y - 1.5, 3, 3); }
    this.renderHud();
  }
  renderHud() {
    const h = this.hud, k = this.k; h.clear();
    // benang: garis tipis di bawah skor
    // bar benang: potongan kertas bergaris tinta, isi gelasan merah bata; berkedip pelan kalau tinggal sedikit
    const x = 18, y = 72, w = 130, hh = 12, low = k.hp < 0.35 && k.alive;
    h.fillStyle(INK, 1); h.fillRect(x + 3, y + 3, w, hh);
    h.fillStyle(PAPER, 1); h.fillRect(x, y, w, hh);
    if (k.hp > 0.01) { h.fillStyle(BRICK, low ? 0.55 + 0.45 * Math.sin(this.time.now / 90) : 1); h.fillRect(x, y, w * k.hp, hh); }
    h.lineStyle(LINE, INK, 1); h.strokeRect(x, y, w, hh);
    for (let i = 1; i < 4; i++) { h.lineStyle(1, INK, 0.35); h.lineBetween(x + w * i / 4, y + 2, x + w * i / 4, y + hh - 2); }
  }
}

// ---------- Kartu skor untuk dibagikan ----------
const PLAY_URL = 'adu-layang-game.vercel.app';
function makeScoreCard(scene, score, cuts, secs, isNew) {
  const CW = 1080, CH = 1350, c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const x = c.getContext('2d');
  // latar: potongan pemandangan game, dirapatkan ke bawah supaya atap kampung terlihat
  const bg = scene.textures.get('bg').getSourceImage(), sc = CW / bg.width;
  x.fillStyle = CSS.sky; x.fillRect(0, 0, CW, CH);
  x.drawImage(bg, 0, CH - bg.height * sc, CW, bg.height * sc);
  const kx = CW - 190, ky = 120, k = KITE.map(([a, b]) => [kx + a * 4.2, ky + b * 4.2]);
  x.strokeStyle = CSS.brick; x.lineWidth = 5; x.beginPath(); x.moveTo(k[2][0], k[2][1]); x.quadraticCurveTo(kx + 60, 600, CW - 60, CH); x.stroke();
  // lembar kertas miring dengan bayangan tinta
  const sheet = [[120, 150], [CW - 110, 130], [CW - 125, 900], [105, 920]];
  const path = (pts, dx = 0, dy = 0) => { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a + dx, b + dy) : x.moveTo(a + dx, b + dy)); x.closePath(); };
  path(sheet, 14, 16); x.fillStyle = CSS.ink; x.fill();
  path(sheet); x.fillStyle = CSS.paper; x.fill(); x.lineWidth = 5; x.strokeStyle = CSS.ink; x.lineJoin = 'round'; x.stroke();
  x.save(); x.translate(CW / 2, 300); x.rotate(-0.06);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '110px ' + LOGO; x.lineWidth = 12; x.strokeStyle = CSS.ink; x.fillStyle = CSS.ink; x.fillText('adu layang', 8, 10);
  x.strokeText('adu layang', 0, 0); x.fillStyle = CSS.paper; x.fillText('adu layang', 0, 0);
  x.restore();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = CSS.ink;
  x.font = '800 210px ' + BODY; x.fillText(String(score), CW / 2, 530);
  x.font = '500 44px ' + BODY; x.fillText(cuts + ' layangan diputus · ' + secs + ' detik di udara', CW / 2, 680);
  if (isNew) { x.font = '800 44px ' + BODY; x.fillStyle = CSS.brick; x.fillText('rekor baru', CW / 2, 750); }
  x.font = '500 36px ' + BODY; x.fillStyle = CSS.ink; x.fillText('bisa kalahkan?', CW / 2, 812);
  x.font = '800 40px ' + BODY; x.fillText(PLAY_URL, CW / 2, 862);
  // layangan bata-kertas di pojok (benangnya sudah digambar di balik lembar)
  x.fillStyle = CSS.brick; x.beginPath(); x.moveTo(...k[0]); x.lineTo(...k[1]); x.lineTo(...k[3]); x.closePath(); x.fill();
  x.fillStyle = CSS.paper; x.beginPath(); x.moveTo(...k[3]); x.lineTo(...k[1]); x.lineTo(...k[2]); x.closePath(); x.fill();
  path(k); x.strokeStyle = CSS.ink; x.lineWidth = 6; x.stroke();
  return c;
}
function shareCard(canvas, score, label) {
  const text = 'Skorku ' + score + ' di Adu Layang. Bisa kalahkan? https://' + PLAY_URL;
  canvas.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'adu-layang-skor.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    // PC atau browser tanpa share: unduh gambarnya
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    label.setText('gambar diunduh');
  }, 'image/png');
}

const boot = () => { if (window.__g) return; window.__g = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: Math.round(W * DPR), height: Math.round(H * DPR), backgroundColor: CSS.sky,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.NO_CENTER }, // #game (flex) yang menengahkan; dua-duanya = kanvas bergeser
  input: { activePointers: 3 },
  render: { antialias: true },
  scene: [Menu, Play],
}); };
// tunggu huruf siap (maks 1,5 detik) supaya logo tidak tampil dengan huruf cadangan
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('48px Shrikhand'), document.fonts.load('800 20px Karla'), document.fonts.load('500 20px Karla')]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 1500)),
]).then(boot, boot);
